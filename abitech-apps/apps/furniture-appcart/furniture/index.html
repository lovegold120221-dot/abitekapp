<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="appkart">
    <meta name="keywords" content="appkart">
    <meta name="author" content="appkart">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="../assets/images/logo/favicon.png" type="image/x-icon">
    <title>Appkart</title>
    <link rel="apple-touch-icon" href="../assets/images/logo/favicon.png">
    <meta name="title-color" content="#00162E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="appkart">
    <meta name="msapplication-TileImage" content="../assets/images/logo/favicon.png">
    <meta name="msapplication-TileColor" content="#FFFFFF">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Google font css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="../../../../fonts.googleapis.com/css2%3Ffamily=Playfair+Display:ital,wght@0,400..900%3B1,400..900&amp;family=Poppins:ital,wght@0,100%3B0,200%3B0,300%3B0,400%3B0,500%3B0,600%3B0,700%3B0,800%3B0,900%3B1,100%3B1,200%3B1,300%3B1,400%3B1,500%3B1,600%3B1,700%3B1,800%3B1,900&amp;display=swap.css"
        rel="stylesheet">


    <!-- Bootstrap css -->
    <link id="rtl-link" rel="stylesheet" type="text/css" href="../assets/css/vendors/bootstrap/bootstrap.min.css">

    <!-- Iconsax css -->
    <link rel="stylesheet" type="text/css" href="../assets/css/iconsax.css">


    <!-- Style css -->
    <link id="change-link" rel="stylesheet" type="text/css" href="../assets/css/style.css">
</head>

<body class="furniture poppins-font">

    <!-- loader Start -->
    <div class="loader">
        <img src="../assets/images/gif/Furniture.gif" class="img-fluid" alt="furniture">
    </div>
    <!-- loader End -->

    <!-- onboarding section start -->
    <section class="pt-0 furniture-onboarding-section">
        <div class="onboarding-furniture-images">
            <img src="../assets/images/furniture/Interior/2.png" class="img-fluid background-img" alt="image">
            <img src="../assets/images/furniture/Interior/1.png" class="img-fluid gulp-img" alt="image">
            <img src="../assets/images/furniture/Interior/3.png" class="img-fluid cher-img" alt="image">
        </div>
        <div class="furniture-intro-section">
            <h1>Furniture in your style <img src="../assets/images/furniture/Interior/10.png" class="img-fluid"
                    alt="image">
            </h1>
            <p>Explore world class top furniture as per
                your requirements & Choice</p>
            <div class="furniture-auth-btn m_top-23">
                <a href="login.html" class="btn furniture-btn ">Get Started</a>
            </div>
        </div>
    </section>

    <!-- onboarding section end -->

    <!-- pwa install app popup start -->
    <div class="offcanvas addtohome-popup show">
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
        <div class="offcanvas-body small">
            <div class="app-info">
                <img src="../assets/images/logo/appkart/48.png" class="img-fluid" alt="logo">
                <div class="content">
                    <h3>Appkart App</h3>
                    <a href="index.html#!">www.appkart-app.com</a>
                </div>
            </div>
            <button class="btn install-app btn-inline home-screen-btn m-0" id="installApp">Add to Home
                Screen</button>
        </div>
    </div>
    <!-- pwa install app popup end -->

    <!-- Bootstrap JS-->
    <script src="../assets/js/vendors/bootstrap/bootstrap.min.js"></script>

    <!-- Iconsax JS-->
    <script src="../assets/js/iconsax.js"></script>

    <!-- Install JS -->
    <script src="../assets/js/homescreen-popup.js"></script>

    <!-- script JS -->
    <script src="../assets/js/script.js"></script>

</body>

</html>
