<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="appkart">
    <meta name="keywords" content="appkart">
    <meta name="author" content="appkart">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="../assets/images/logo/favicon.png" type="image/x-icon">
    <title>Appkart</title>
    <link rel="apple-touch-icon" href="../assets/images/logo/favicon.png">
    <meta name="title-color" content="#00162E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="appkart">
    <meta name="msapplication-TileImage" content="../assets/images/logo/favicon.png">
    <meta name="msapplication-TileColor" content="#FFFFFF">

    <!-- Google font css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="../../../../fonts.googleapis.com/css2%3Ffamily=Outfit:wght@100..900&amp;display=swap.css" rel="stylesheet">

    <!-- Bootstrap css -->
    <link id="rtl-link" rel="stylesheet" type="text/css" href="../assets/css/vendors/bootstrap/bootstrap.min.css">

    <!-- Iconsax css -->
    <link rel="stylesheet" type="text/css" href="../assets/css/iconsax.css">

    <!-- Style css -->
    <link id="change-link" rel="stylesheet" type="text/css" href="../assets/css/style.css">

<body class="learning outfit-font">

    <!-- loader Start -->
    <div class="loader">
        <img src="../assets/images/gif/learning.gif" class="img-fluid" alt="learning">
    </div>
    <!-- loader End -->

    <!-- Onboarding section start  -->
    <div class="learning-onboarding-section">
        <div class="learning-img">
            <img src="../assets/images/learning/background/1.png" class="img-fluid" alt="png">
        </div>
        <div class="learning-onboarding-content">
            <h2>Find Your <span>Educational</span> Journey</h2>
            <p>Students can explore any course published in crowd learn and they can enroll any
                course they prefer</p>
            <a href="login.html" class="btn learning-btn">Get Started</a>
            <a href="home.html" class="learn-skip">Skip</a>
        </div>
    </div>
    <!-- onboarding section end -->

    <!-- pwa install app popup start -->
    <div class="offcanvas addtohome-popup show">
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
        <div class="offcanvas-body small">
            <div class="app-info">
                <img src="../assets/images/logo/appkart/48.png" class="img-fluid" alt="logo">
                <div class="content">
                    <h3>Appkart App</h3>
                    <a href="index.html#!">www.appkart-app.com</a>
                </div>
            </div>
            <button class="btn  install-app btn-inline home-screen-btn m-0" id="installApp">Add to Home
                Screen</button>
        </div>
    </div>
    <!-- pwa install app popup end -->

    <!-- Bootstrap JS-->
    <script src="../assets/js/vendors/bootstrap/bootstrap.min.js"></script>

    <!-- Iconsax JS-->
    <script src="../assets/js/iconsax.js"></script>

    <!-- Install JS -->
    <script src="../assets/js/homescreen-popup.js"></script>

    <!-- script JS -->
    <script src="../assets/js/script.js"></script>
</body>

</html>
