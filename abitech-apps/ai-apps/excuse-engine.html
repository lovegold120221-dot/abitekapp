<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excuse Engine — Abitech AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; }
    .fade-in { animation: fadeIn .4s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-[#3b0764] to-[#701a75] text-fuchsia-100">
  <div class="max-w-2xl mx-auto px-4 py-8">
    <div class="text-center mt-4">
      <div class="text-5xl">🤥</div>
      <h1 class="text-3xl font-bold mt-2 text-white">Excuse Engine</h1>
      <p class="text-sm text-fuchsia-300/80 mt-1">Late? Unprepared? Busted? Get three ranked excuses with believability scores.</p>
    </div>

    <div class="mt-6 bg-black/30 rounded-2xl p-5 border border-fuchsia-500/30">
      <input id="sitInput" placeholder="Situation: e.g. missed the morning standup…" class="w-full bg-black/30 rounded-xl px-3 py-2.5 text-sm outline-none border border-fuchsia-500/30 focus:border-fuchsia-400 placeholder:text-fuchsia-200/40" />
      <div class="flex gap-2 mt-3">
        <select id="whoInput" class="bg-black/30 rounded-full px-4 py-2.5 text-sm border border-fuchsia-500/30 outline-none">
          <option value="my boss">💼 Boss</option><option value="my teacher">🏫 Teacher</option><option value="my partner">❤️ Partner</option><option value="my landlord">🏠 Landlord</option><option value="the group chat">👥 Group chat</option>
        </select>
        <button id="genBtn" onclick="generate()" class="flex-1 bg-fuchsia-600 hover:bg-fuchsia-500 text-white font-semibold text-sm py-2.5 rounded-full transition">Generate alibis 🎭</button>
      </div>
    </div>

    <div id="errorBox" class="hidden mt-4 text-sm bg-red-500/20 border border-red-400/40 rounded-xl p-3"></div>
    <div id="result" class="mt-5 space-y-3"></div>
  </div>

  <script>
const GEMINI_KEY = sessionStorage.getItem('abitech_gemini_key') || '';
    const GEMINI_MODEL = "gemini-3.5-flash-lite";
    const LIVE_MODEL = "gemini-3.5-flash-live";
    const SYSTEM = "You invent funny excuses. Reply with EXACTLY 3 lines, each like:\n<number 0-100>% | <the excuse, one sentence>\nRank best first. Keep each excuse under 25 words. No intro, no outro.";
    function esc(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' }[c])); }

    // Gemini Live API TTS voice state
    let ttsWs = null;
    let ttsQueue = [];
    let ttsSpeaking = false;
    function ttsSpeakQueue() {
      if (ttsSpeaking || !ttsWs) return;
      if (ttsQueue.length === 0) { ttsSpeaking = false; return; }
      const text = ttsQueue.shift();
      ttsSpeaking = true;
      ttsWs.send(JSON.stringify({
        turns: [{ parts: [{ text: text }] }], turnComplete: true
      }));
    }
    function ttsStop() { try { if (ttsWs) ttsWs.close(); ttsSpeaking = false; ttsQueue = []; } catch (e) {} }

    // Initialise Live API TTS WebSocket
    function ttsInit() {
      if (ttsWs) return;
      const wsUrl = `wss://generativelanguage.googleapis.com/v1beta/models/${LIVE_MODEL}:streamGenerateContent?key=${GEMINI_KEY}`;
      ttsWs = new WebSocket(wsUrl);
      ttsWs.onopen = () => ttsSpeakQueue();
      ttsWs.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.serverContent && data.serverContent.modelTurn && data.serverContent.modelTurn.parts) {
          const audioB64 = data.serverContent.modelTurn.parts.find(p => p.inlineData).inlineData.data;
          const audioBlob = base64ToBlob(audioB64, 'audio/mp3');
          const url = URL.createObjectURL(audioBlob);
          const audio = new Audio(url);
          audio.play().catch(() => {});
          ttsSpeaking = false;
          ttsSpeakQueue();
        }
      };
      ttsWs.onerror = () => { ttsSpeaking = false; ttsSpeakQueue(); };
    }

    // Send text to Gemini Live API for TTS
    function ttsPlay(text) {
      try { text = String(text).replace(/[*#_]/g, '').slice(0, 800); } catch (e) {}
      if (!text) return;
      ttsQueue.push(text);
      ttsInit();
      ttsSpeakQueue();
    }

    // Base64 decode helper for audio chunks
    function base64ToBlob(b64, mime) {
      const byteChars = atob(b64);
      const byteNumbers = new Uint8Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      return new Blob([byteNumbers], { type: mime });
    }

    async function gemini(user) {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_KEY}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system_instruction: { parts: [{ text: SYSTEM }] }, contents: [{ parts: [{ text: user }] }], generationConfig: { temperature: 1.05, maxOutputTokens: 400 } })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      return data.candidates[0].content.parts.map(p => p.text || '').join('');
    }

    async function generate() {
      const sit = document.getElementById('sitInput').value.trim();
      const who = document.getElementById('whoInput').value;
      const btn = document.getElementById('genBtn'), err = document.getElementById('errorBox'), out = document.getElementById('result');
      err.classList.add('hidden');
      if (!sit) { err.textContent = 'What do you need an excuse for?'; err.classList.remove('hidden'); return; }
      btn.disabled = true; btn.textContent = 'Fabricating… 🧵'; out.innerHTML = '';
      try {
        const raw = await gemini(`Situation: ${sit}\nExcuse is for: ${who}.`);
        const lines = raw.split('\n').map(l => l.trim()).filter(l => /\d+\s*%/.test(l)).slice(0, 3);
        const medals = ['🥇', '🥈', '🥉'];
        out.innerHTML = (lines.length ? lines : [raw]).map((line, i) => {
          const m = line.match(/(\d+)\s*%\s*\|?\s*(.*)/);
          const pct = m ? Math.min(99, +m[1]) : 50, text = m ? m[2] : line;
          const color = pct >= 75 ? 'bg-green-500' : pct >= 50 ? 'bg-yellow-500' : 'bg-red-500';
          return `<div class="fade-in bg-black/30 rounded-2xl p-4 border border-fuchsia-500/30">
            <div class="flex items-center gap-2"><span class="text-xl">${medals[i] || '🎖️'}</span>
            <p class="text-sm font-medium flex-1">${esc(text)}</p></div>
            <div class="flex items-center gap-2 mt-2"><div class="flex-1 h-2 bg-white/10 rounded-full overflow-hidden"><div class="h-full ${color} rounded-full" style="width:${pct}%"></div></div>
            <span class="text-xs font-bold">${pct}% believable</span></div></div>`;
        }).join('');
      } catch (e) { err.textContent = 'Alibi collapsed: ' + e.message; err.classList.remove('hidden'); }
      btn.disabled = false; btn.textContent = 'Generate alibis 🎭';
    }
  </script>
</body>
</html>
