<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision Lens — Abitech AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; }
    .fade-in { animation: fadeIn .4s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .drop-active { border-color: #f472b6 !important; background: rgba(244,114,182,.08); }
  </style>
</head>
<body class="min-h-screen bg-[#160f14] text-pink-50">
  <div class="max-w-3xl mx-auto px-4 py-8">
    <a href="../index.html" class="text-xs text-pink-300/80 hover:text-white">← Abitech Apps Store</a>

    <div class="text-center mt-4">
      <div class="text-5xl">👁️</div>
      <h1 class="text-3xl font-bold mt-2">Vision Lens</h1>
      <p class="text-sm text-pink-200/80 mt-1">Drop in a photo — a Vision Transformer names what it sees.</p>
    </div>

    <div class="mt-4 flex justify-center text-[11px]">
      <span id="modelBadge" class="px-3 py-1 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30">Loading ViT…</span>
    </div>

    <div class="mt-6 grid md:grid-cols-2 gap-4">
      <div>
        <label id="drop" for="file"
          class="flex flex-col items-center justify-center h-64 rounded-2xl border-2 border-dashed border-pink-800/60 hover:border-pink-500/70 cursor-pointer transition overflow-hidden bg-black/20">
          <img id="preview" alt="" class="hidden w-full h-full object-contain" />
          <div id="dropHint" class="text-center px-4">
            <div class="text-4xl mb-2">🖼️</div>
            <p class="text-sm text-pink-200/70">Click or drop an image here</p>
            <p class="text-[11px] text-pink-200/40 mt-1">JPG, PNG or WebP — stays on your device</p>
          </div>
        </label>
        <input id="file" type="file" accept="image/*" class="hidden" />
      </div>

      <div class="bg-pink-950/30 rounded-2xl p-4 border border-pink-900/60">
        <div id="out" class="text-sm text-pink-200/50">Load an image to see the top predictions.</div>
        <div id="errorBox" class="hidden mt-3 text-sm bg-red-500/15 border border-red-400/40 rounded-xl p-3"></div>
      </div>
    </div>

    <p class="mt-6 text-[11px] text-pink-200/50 text-center leading-relaxed">
      Uses <b>Xenova/vit-base-patch16-224</b> (ImageNet-1k, 1000 classes) through <b>transformers.js</b>.
      Images are decoded and classified inside this tab only.
    </p>
  </div>

  <script type="module">
    import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0";

    const modelBadge = document.getElementById('modelBadge');
    const out = document.getElementById('out');
    const errBox = document.getElementById('errorBox');
    const preview = document.getElementById('preview');
    const dropHint = document.getElementById('dropHint');
    const drop = document.getElementById('drop');
    const fileInput = document.getElementById('file');
    let classifier = null;
    let busy = false;

    function esc(value) {
      return String(value || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function showError(msg) { errBox.textContent = msg; errBox.classList.remove('hidden'); }
    function clearError() { errBox.classList.add('hidden'); }
    function prettify(label) { return String(label || '').replace(/_/g, ' ').replace(/,/g, ', '); }

    async function boot() {
      try {
        classifier = await pipeline('image-classification', 'Xenova/vit-base-patch16-224');
        modelBadge.textContent = 'ViT ready';
        modelBadge.className = 'px-3 py-1 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30';
      } catch (e) {
        modelBadge.textContent = 'Model failed to load';
        modelBadge.className = 'px-3 py-1 rounded-full bg-red-500/15 text-red-300 border border-red-500/30';
        showError('Could not load the model: ' + (e && e.message ? e.message : e));
      }
    }

    async function classify(file) {
      if (busy) return;
      clearError();
      if (!file || !file.type.startsWith('image/')) return showError('That file is not an image.');
      if (!classifier) return showError('The model is still loading.');

      preview.src = URL.createObjectURL(file);
      preview.classList.remove('hidden');
      dropHint.classList.add('hidden');
      drop.classList.remove('h-64');
      drop.classList.add('h-64');

      busy = true;
      out.innerHTML = '<p class="text-pink-200/60 animate-pulse">Analysing…</p>';
      try {
        const results = await classifier(preview.src, { top_k: 5 });
        const best = results[0];
        out.innerHTML = `
          <div class="fade-in">
            <p class="text-xs text-pink-300/70">Confident guess</p>
            <p class="text-lg font-bold text-pink-100 capitalize">${esc(prettify(best.label))}</p>
            <p class="text-[11px] text-pink-200/50 mb-3">${Math.round(best.score * 100)}% confidence</p>
            <div class="space-y-2.5">
              ${results.map(r => {
                const pct = Math.round(r.score * 100);
                return `
                  <div>
                    <div class="flex justify-between text-[11px] mb-1">
                      <span class="capitalize ${r === best ? 'text-pink-100 font-semibold' : 'text-pink-200/60'}">${esc(prettify(r.label))}</span>
                      <span class="text-pink-200/50">${pct}%</span>
                    </div>
                    <div class="h-1.5 rounded-full bg-black/40 overflow-hidden">
                      <div class="h-full ${r === best ? 'bg-pink-400' : 'bg-pink-800'}" style="width:${pct}%"></div>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>`;
      } catch (e) {
        out.innerHTML = '<p class="text-pink-200/50">Analysis failed.</p>';
        showError('Classification failed: ' + (e && e.message ? e.message : e));
      } finally {
        busy = false;
      }
    }

    fileInput.addEventListener('change', e => {
      const f = e.target.files && e.target.files[0];
      if (f) classify(f);
      e.target.value = '';
    });

    ['dragenter', 'dragover'].forEach(evt => drop.addEventListener(evt, e => {
      e.preventDefault();
      drop.classList.add('drop-active');
    }));
    ['dragleave', 'drop'].forEach(evt => drop.addEventListener(evt, e => {
      e.preventDefault();
      drop.classList.remove('drop-active');
    }));
    drop.addEventListener('drop', e => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) classify(f);
    });

    boot();
  </script>
</body>
</html>
