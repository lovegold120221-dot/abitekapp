<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Debate Arena — Abitech AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; }
    .fade-in { animation: fadeIn .4s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="min-h-screen bg-[#1c0f0a] text-orange-100">
  <div class="max-w-2xl mx-auto px-4 py-8">
    <div class="text-center mt-4">
      <div class="text-5xl">⚔️</div>
      <h1 class="text-3xl font-bold mt-2 text-white">Debate Arena</h1>
      <p class="text-sm text-orange-300/80 mt-1">Pick a topic and a side. The AI takes the other side. Three rounds. No mercy.</p>
    </div>

    <div id="setup" class="mt-6 bg-black/40 rounded-2xl p-5 border border-orange-700/40">
      <input id="topicInput" placeholder="Topic: e.g. pineapple belongs on pizza" class="w-full bg-black/40 rounded-xl px-3 py-2.5 text-sm outline-none border border-orange-700/40 focus:border-orange-400 placeholder:text-orange-200/30" />
      <div class="flex gap-2 mt-3">
        <select id="stanceInput" class="bg-black/40 rounded-full px-4 py-2.5 text-sm border border-orange-700/40 outline-none">
          <option value="for">🟢 I argue FOR</option>
          <option value="against">🔴 I argue AGAINST</option>
        </select>
        <button onclick="start()" class="flex-1 bg-orange-600 hover:bg-orange-500 text-white font-semibold text-sm py-2.5 rounded-full transition">Enter the arena 🏟️</button>
      </div>
    </div>

    <div id="scorebar" class="hidden mt-4 flex items-center gap-3 text-sm font-semibold">
      <span class="text-green-400">YOU <span id="youScore">0</span></span>
      <div class="flex-1 h-2 bg-white/10 rounded-full overflow-hidden"><div id="scoreFill" class="h-full bg-gradient-to-r from-green-500 to-red-500 rounded-full" style="width:50%"></div></div>
      <span class="text-red-400">AI <span id="aiScore">0</span></span>
    </div>

    <div id="errorBox" class="hidden mt-4 text-sm bg-red-500/20 border border-red-400/40 rounded-xl p-3"></div>
    <div id="arena" class="mt-4 space-y-4"></div>

    <div id="turnBox" class="hidden mt-4 bg-black/40 rounded-2xl p-4 border border-orange-700/40">
      <p id="roundLabel" class="text-xs uppercase tracking-widest text-orange-300 font-semibold mb-2"></p>
      <textarea id="argInput" rows="3" placeholder="Make your argument…" class="w-full bg-black/40 rounded-xl p-3 text-sm outline-none border border-orange-700/40 focus:border-orange-400"></textarea>
      <button id="hitBtn" onclick="hit()" class="mt-2 w-full bg-red-600 hover:bg-red-500 font-semibold text-sm py-2.5 rounded-full transition">Strike back 👊</button>
    </div>
  </div>

  <script>
const GEMINI_KEY = sessionStorage.getItem('abitech_gemini_key') || '';
    const GEMINI_MODEL = "gemini-3.5-flash-lite";
    const LIVE_MODEL = "gemini-3.5-flash-live";
    let history = [], round = 0, you = 0, ai = 0, aiStance = '';
    function esc(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' }[c])); }
    function fmt(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>'); }

    // Gemini Live API TTS voice state
    let ttsWs = null;
    let ttsQueue = [];
    let ttsSpeaking = false;
    function ttsSpeakQueue() {
      if (ttsSpeaking || !ttsWs) return;
      if (ttsQueue.length === 0) { ttsSpeaking = false; return; }
      const text = ttsQueue.shift();
      ttsSpeaking = true;
      ttsWs.send(JSON.stringify({
        turns: [{ parts: [{ text: text }] }], turnComplete: true
      }));
    }
    function ttsStop() { try { if (ttsWs) ttsWs.close(); ttsSpeaking = false; ttsQueue = []; } catch (e) {} }

    // Initialise Live API TTS WebSocket
    function ttsInit() {
      if (ttsWs) return;
      const wsUrl = `wss://generativelanguage.googleapis.com/v1beta/models/${LIVE_MODEL}:streamGenerateContent?key=${GEMINI_KEY}`;
      ttsWs = new WebSocket(wsUrl);
      ttsWs.onopen = () => ttsSpeakQueue();
      ttsWs.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.serverContent && data.serverContent.modelTurn && data.serverContent.modelTurn.parts) {
          const audioB64 = data.serverContent.modelTurn.parts.find(p => p.inlineData).inlineData.data;
          const audioBlob = base64ToBlob(audioB64, 'audio/mp3');
          const url = URL.createObjectURL(audioBlob);
          const audio = new Audio(url);
          audio.play().catch(() => {});
          ttsSpeaking = false;
          ttsSpeakQueue();
        }
      };
      ttsWs.onerror = () => { ttsSpeaking = false; ttsSpeakQueue(); };
    }

    // Send text to Gemini Live API for TTS
    function ttsPlay(text) {
      try { text = String(text).replace(/[*#_]/g, '').slice(0, 800); } catch (e) {}
      if (!text) return;
      ttsQueue.push(text);
      ttsInit();
      ttsSpeakQueue();
    }

    // Base64 decode helper for audio chunks
    function base64ToBlob(b64, mime) {
      const byteChars = atob(b64);
      const byteNumbers = new Uint8Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      return new Blob([byteNumbers], { type: mime });
    }

    async function call(contents, temp) {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_KEY}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents, generationConfig: { temperature: temp, maxOutputTokens: 700 } })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      return data.candidates[0].content.parts.map(p => p.text || '').join('');
    }
    function bubble(who, html) {
      const me = who === 'you';
      document.getElementById('arena').insertAdjacentHTML('beforeend',
        `<div class="fade-in flex ${me ? 'justify-end' : 'justify-start'}"><div class="max-w-[85%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${me ? 'bg-green-700/80' : 'bg-red-900/70 border border-red-500/30'}">
        <p class="text-[10px] uppercase tracking-widest opacity-70 mb-1">${me ? '🟢 You' : '🔴 AI rival'}</p><div>${html}</div></div></div>`);
    }
    function paintScore() {
      document.getElementById('youScore').textContent = you;
      document.getElementById('aiScore').textContent = ai;
      const total = Math.max(1, you + ai);
      document.getElementById('scoreFill').style.width = (you / total * 100) + '%';
    }
    function takeScore(text) {
      const m = text.match(/YOU\s*(\d+)\s*[-–]\s*AI\s*(\d+)/i);
      if (m) { you += +m[1]; ai += +m[2]; paintScore(); }
      return text.replace(/SCORE:.*$/gim, '').trim();
    }

    async function start() {
      const topic = document.getElementById('topicInput').value.trim();
      const stance = document.getElementById('stanceInput').value;
      const err = document.getElementById('errorBox');
      err.classList.add('hidden');
      if (!topic) { err.textContent = 'Name a topic to fight over.'; err.classList.remove('hidden'); return; }
      aiStance = stance === 'for' ? 'AGAINST' : 'FOR';
      round = 0; you = 0; ai = 0; paintScore();
      history = [{ role: 'user', parts: [{ text: `We are debating: "${topic}". I argue ${stance.toUpperCase()}, you argue ${aiStance}. Best of 3 rounds. Open with a fierce 2-sentence opening statement ${aiStance} the topic. End with exactly: SCORE: YOU 0 - AI 0` }] }];
      document.getElementById('setup').classList.add('hidden');
      document.getElementById('scorebar').classList.remove('hidden');
      document.getElementById('scorebar').classList.add('flex');
      try {
        const text = await call(history, 0.95);
        history.push({ role: 'model', parts: [{ text }] });
        bubble('ai', fmt(takeScore(text)));
        nextRound();
      } catch (e) { err.textContent = 'Arena error: ' + e.message; err.classList.remove('hidden'); }
    }
    function nextRound() {
      round++;
      if (round > 3) return finish();
      document.getElementById('roundLabel').textContent = `Round ${round} of 3 — your move`;
      document.getElementById('argInput').value = '';
      document.getElementById('turnBox').classList.remove('hidden');
    }
    async function hit() {
      const arg = document.getElementById('argInput').value.trim();
      const err = document.getElementById('errorBox'), btn = document.getElementById('hitBtn');
      err.classList.add('hidden');
      if (!arg) { err.textContent = 'Say something first, champ.'; err.classList.remove('hidden'); return; }
      bubble('you', fmt(arg));
      document.getElementById('turnBox').classList.add('hidden');
      btn.disabled = true; btn.textContent = 'Rival is thinking…';
      history.push({ role: 'user', parts: [{ text: `My round-${round} argument: ${arg}\nRebut it fiercely in ≤120 words, then score THIS round only on a line exactly: SCORE: YOU <0-10> - AI <0-10>` }] });
      try {
        const text = await call(history, 0.95);
        history.push({ role: 'model', parts: [{ text }] });
        bubble('ai', fmt(takeScore(text)));
      } catch (e) { err.textContent = 'Arena error: ' + e.message; err.classList.remove('hidden'); }
      btn.disabled = false; btn.textContent = 'Strike back 👊';
      nextRound();
    }
    async function finish() {
      history.push({ role: 'user', parts: [{ text: 'The debate is over. Deliver a final verdict: who won and why, in 3 sentences. No score line.' }] });
      try {
        const text = await call(history, 0.7);
        bubble('ai', '🏆 <b>FINAL VERDICT</b><br>' + fmt(text));
      } catch (e) { document.getElementById('errorBox').textContent = 'Arena error: ' + e.message; document.getElementById('errorBox').classList.remove('hidden'); }
      const w = you === ai ? "It's a draw — rematch?" : (you > ai ? 'You take the crown! 👑' : 'The AI takes this one. Demand a rematch. 🤖');
      document.getElementById('arena').insertAdjacentHTML('beforeend', `<p class="fade-in text-center text-sm font-bold pt-2">${w} <button onclick="location.reload()" class="underline text-orange-300">Rematch</button></p>`);
    }
  </script>
</body>
</html>
