<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "CardSans";
      src: url("file:///usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: "CardSans";
      src: url("file:///usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #ffffff;
    }
    body {
      font-family: "CardSans", "Liberation Sans", sans-serif;
      color: #0B1B33;
      position: relative;
      background:
        radial-gradient(1200px 500px at 50% 42%, #ffffff 0%, #f5f9ff 62%, #eaf2fc 100%);
    }
    .bar {
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 8px;
      background: #1D6FE8;
    }
    .bar-bottom {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 8px;
      background: #0B1B33;
    }
    .tri {
      position: absolute;
      pointer-events: none;
    }
    .lockup {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .mark {
      width: 76px;
      height: 76px;
      margin-bottom: 28px;
    }
    h1 {
      font-size: 92px;
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1;
      color: #0B1B33;
      margin-bottom: 22px;
    }
    .rule {
      width: 52px;
      height: 4px;
      background: #1D6FE8;
      border-radius: 2px;
      margin-bottom: 22px;
    }
    p {
      font-size: 26px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: #0B1B33;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="bar-bottom"></div>
  <svg class="tri" style="left:-36px;top:70px;width:220px;height:220px;opacity:0.07" viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="50,6 96,90 4,90" fill="#1D6FE8"/>
  </svg>
  <svg class="tri" style="right:-50px;bottom:18px;width:320px;height:320px;opacity:0.08" viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="100,0 100,100 0,100" fill="#1D6FE8"/>
  </svg>
  <svg class="tri" style="right:180px;top:48px;width:72px;height:72px;opacity:0.12" viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="50,8 92,88 8,88" fill="#1D6FE8"/>
  </svg>
  <div class="lockup">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <polygon points="32,4 60,58 4,58" fill="#1D6FE8"/>
      <polygon points="32,22 41.5,42 22.5,42" fill="#ffffff"/>
    </svg>
    <h1>ABI Tech</h1>
    <div class="rule"></div>
    <p>Turn AI Into Real Business Growth</p>
  </div>
</body>
</html>
