<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="appkart">
    <meta name="keywords" content="appkart">
    <meta name="author" content="appkart">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="../assets/images/logo/favicon.png" type="image/x-icon">
    <title>Appkart</title>
    <link rel="apple-touch-icon" href="../assets/images/logo/favicon.png">
    <meta name="title-color" content="#00162E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="appkart">
    <meta name="msapplication-TileImage" content="../assets/images/logo/favicon.png">
    <meta name="msapplication-TileColor" content="#FFFFFF">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Google font css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="../../../../fonts.googleapis.com/css2%3Ffamily=Poppins:ital,wght@0,100%3B0,200%3B0,300%3B0,400%3B0,500%3B0,600%3B0,700%3B0,800%3B0,900%3B1,100%3B1,200%3B1,300%3B1,400%3B1,500%3B1,600%3B1,700%3B1,800%3B1,900&amp;display=swap.css"
        rel="stylesheet">


    <!-- Bootstrap css -->
    <link id="rtl-link" rel="stylesheet" type="text/css" href="../assets/css/vendors/bootstrap/bootstrap.min.css">

    <!-- Iconsax css -->
    <link rel="stylesheet" type="text/css" href="../assets/css/iconsax.css">


    <!-- Style css -->
    <link id="change-link" rel="stylesheet" type="text/css" href="../assets/css/style.css">
</head>

<body class="furniture poppins-font">

    <!-- loader Start -->
    <div class="loader">
        <img src="../assets/images/gif/Furniture.gif" class="img-fluid" alt="furniture">
    </div>
    <!-- loader End -->

    <!-- header start -->
    <header class="furniture-header">
        <div class="custom-container2">
            <div class="header-panel">
                <button class="left-btn" onclick="history.back()">
                    <i class="iconsax arrow-icon" data-icon="arrow-left"></i>
                </button>
                <h3>Choose Language</h3>
            </div>
        </div>
    </header>
    <!-- header  end  -->

    <!-- language section start -->
    <section class="pt-0 furniture-language-section">
        <div class="custom-container2">
            <ul class="choose-language-wrapper">
                <li>
                    <label for="value" class="choose-box">
                        <span class="choose-info">
                            <input type="radio" class="check-circle" name="payment" id="value">
                            <img src="../assets/images/flag/flag1.svg" class="img-fluid" alt="flag">
                            <span class="choose-language">
                                <span class="lang-title">Arab</span>
                            </span>
                        </span>
                    </label>
                </li>
                <li>
                    <label for="value1" class="choose-box">
                        <span class="choose-info">
                            <input type="radio" class="check-circle" name="payment" id="value1" checked>
                            <img src="../assets/images/flag/flag2.svg" class="img-fluid" alt="flag">
                            <span class="choose-language">
                                <span class="lang-title">English <span>(Uk)</span></span>
                            </span>
                        </span>
                    </label>
                </li>
                <li>
                    <label for="value2" class="choose-box">
                        <span class="choose-info">
                            <input type="radio" class="check-circle" name="payment" id="value2">
                            <img src="../assets/images/flag/flag16.svg" class="img-fluid" alt="flag">
                            <span class="choose-language">
                                <span class="lang-title">Australia <span>(English)</span></span>
                            </span>
                        </span>
                    </label>
                </li>
                <li>
                    <label for="value3" class="choose-box">
                        <span class="choose-info">
                            <input type="radio" class="check-circle" name="payment" id="value3">
                            <img src="../assets/images/flag/flag5.svg" class="img-fluid" alt="flag">
                            <span class="choose-language">
                                <span class="lang-title">India <span>(Hindi)</span></span>
                            </span>
                        </span>
                    </label>
                </li>
                <li>
                    <label for="value4" class="choose-box">
                        <span class="choose-info">
                            <input type="radio" class="check-circle" name="payment" id="value4">
                            <img src="../assets/images/flag/flag8.svg" class="img-fluid" alt="flag">
                            <span class="choose-language">
                                <span class="lang-title">Egypt <span>(Syria)</span></span>
                            </span>
                        </span>
                    </label>
                </li>
                <li>
                    <label for="value5" class="choose-box">
                        <span class="choose-info">
                            <input type="radio" class="check-circle" name="payment" id="value5">
                            <img src="../assets/images/flag/flag9.svg" class="img-fluid" alt="flag">
                            <span class="choose-language">
                                <span class="lang-title">Bangladesh</span>
                            </span>
                        </span>
                    </label>
                </li>
                <li>
                    <label for="value6" class="choose-box">
                        <span class="choose-info">
                            <input type="radio" class="check-circle" name="payment" id="value6">
                            <img src="../assets/images/flag/flag14.svg" class="img-fluid" alt="flag">
                            <span class="choose-language">
                                <span class="lang-title">Philippines <span>(tagalog)</span></span>
                            </span>
                        </span>
                    </label>
                </li>
                <li>
                    <label for="value7" class="choose-box">
                        <span class="choose-info">
                            <input type="radio" class="check-circle" name="payment" id="value7">
                            <img src="../assets/images/flag/flag10.svg" class="img-fluid" alt="flag">
                            <span class="choose-language">
                                <span class="lang-title">Nepal</span>
                            </span>
                        </span>
                    </label>
                </li>
            </ul>
        </div>
    </section>
    <!-- language section  end  -->

    <!-- button button start -->
    <div class="furniture-fix-button">
        <a href="profile.html" class="btn furniture-btn">Apply</a>
    </div>
    <!-- button button  end  -->

    <!-- Bootstrap JS-->
    <script src="../assets/js/vendors/bootstrap/bootstrap.min.js"></script>

    <!-- Iconsax JS-->
    <script src="../assets/js/iconsax.js"></script>

    <!-- script JS -->
    <script src="../assets/js/script.js"></script>

</body>

</html>
