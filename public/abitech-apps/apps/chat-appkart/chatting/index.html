<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="appkart">
    <meta name="keywords" content="appkart">
    <meta name="author" content="appkart">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00162E">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="../assets/images/logo/favicon.png" type="image/x-icon">
    <title>Appkart</title>
    <link rel="apple-touch-icon" href="../assets/images/logo/favicon.png">
    <meta name="title-color" content="#00162E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="appkart">
    <meta name="msapplication-TileImage" content="../assets/images/logo/favicon.png">
    <meta name="msapplication-TileColor" content="#FFFFFF">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Google font css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="../../../../fonts.googleapis.com/css2%3Ffamily=Manrope:wght@200..800&amp;display=swap.css" rel="stylesheet">

    <!-- Bootstrap css -->
    <link id="rtl-link" rel="stylesheet" type="text/css" href="../assets/css/vendors/bootstrap/bootstrap.min.css">

    <!-- Iconsax css -->
    <link rel="stylesheet" type="text/css" href="../assets/css/iconsax.css">

    <!-- Style css -->
    <link id="change-link" rel="stylesheet" type="text/css" href="../assets/css/style.css">
</head>

<body class="chatting manrope-font position-relative">

    <!-- loader Start -->
    <div class="loader">
        <img src="../assets/images/gif/chatting.gif" class="img-fluid" alt="chatting">
    </div>
    <!-- loader End -->

    <!-- Onboarding start -->
    <section class="pt-0 main-onboarding-wrapper">
        <div class="onboarding-image">
            <img src="../assets/images/chatting/onborading/1.png" class="img-fluid w-100" alt="bg-image">
            <img src="../assets/images/chatting/onborading/2.png" class="img-fluid onboarding-chat-image" alt="image2">
        </div>
        <div class="bottom-onboarding-box">
            <div class="onboarding-container">
                <h2>Chatting, Made simple.</h2>
                <div class="onboarding-line-content">
                    <img src="../assets/images/chatting/svg/1.svg" class="img-fluid" alt="svg">
                </div>
                <p>Organize meetings, extend invitations, Talk about anything together.</p>
            </div>
            <div class="onboarding-back-box">
                <a href="login.html">
                    <img src="../assets/images/chatting/svg/2.svg" class="img-fluid back-icon" alt="back-icon">
                </a>
            </div>
        </div>
    </section>
    <!-- Onboarding End -->

    <!-- pwa install app popup start -->
    <div class="offcanvas  addtohome-popup show">
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
        <div class="offcanvas-body small">
            <div class="app-info">
                <img src="../assets/images/logo/appkart/48.png" class="img-fluid" alt="logo">
                <div class="content">
                    <h3>Appkart App</h3>
                    <a href="index.html#!">www.appkart-app.com</a>
                </div>
            </div>
            <button class="btn theme-btn install-app btn-inline home-screen-btn m-0" id="installApp">Add to Home
                Screen</button>
        </div>
    </div>
    <!-- pwa install app popup end -->

    <!-- Bootstrap js-->
    <script src="../assets/js/vendors/bootstrap/bootstrap.min.js"></script>

    <!-- Iconsax js-->
    <script src="../assets/js/iconsax.js"></script>

    <!-- Install JS -->
    <script src="../assets/js/homescreen-popup.js"></script>

    <!-- script js-->
    <script src="../assets/js/script.js"></script>
</body>

</html>
