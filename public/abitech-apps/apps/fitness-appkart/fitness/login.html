<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="appkart">
    <meta name="keywords" content="appkart">
    <meta name="author" content="appkart">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="../assets/images/logo/favicon.png" type="image/x-icon">
    <title>Appkart</title>
    <link rel="apple-touch-icon" href="../assets/images/logo/favicon.png">
    <meta name="title-color" content="#00162E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="appkart">
    <meta name="msapplication-TileImage" content="../assets/images/logo/favicon.png">
    <meta name="msapplication-TileColor" content="#FFFFFF">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Google font css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="../../../../fonts.googleapis.com/css2%3Ffamily=Outfit:wght@100..900&amp;display=swap.css" rel="stylesheet">

    <!-- Bootstrap css -->
    <link id="rtl-link" rel="stylesheet" type="text/css" href="../assets/css/vendors/bootstrap/bootstrap.min.css">

    <!-- Iconsax css -->
    <link rel="stylesheet" type="text/css" href="../assets/css/iconsax.css">

    <!-- Style css -->
    <link id="change-link" rel="stylesheet" type="text/css" href="../assets/css/style.css">
</head>

<body class="fitness outfit-font">

    <!-- loader Start -->
    <div class="loader loading">
        <img src="../assets/images/gif/fitness.gif" class="img-fluid" alt="fitness">
    </div>
    <!-- loader End -->

    <!--  header section start -->
    <header class="fitness-header">
        <div class="custom-container2">
            <div class="fitness-header-wrapper">
                <div class="fitness-header-content">
                    <h2>Welcome Back!</h2>
                    <h3>We happy to see you here again.enter your
                        email address and password</h3>
                </div>
            </div>
        </div>
    </header>
    <!--  header section end -->

    <!-- auth section start -->
    <section class="pt-0 fitness-auth-section">
        <div class="custom-container2">
            <form class="fitness-auth-form">
                <div class="form-group">
                    <label class="form-check-label" for="Email">Email</label>
                    <input type="email" class="form-control" id="Email" placeholder="Email Address">
                </div>
                <div class="form-group">
                    <label class="form-check-label" for="number">Phone Number</label>
                    <input type="number" class="form-control" id="number" placeholder="Enter your number">
                </div>
                <div class="form-group">
                    <label class="form-check-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password">
                </div>
                <div class="flex-spacing">
                    <div>
                        <label class="custom-checkbox">
                            <input type="checkbox">
                            <span class="checkmark"></span>
                            Remember
                        </label>
                    </div>
                    <a href="forget.html">Forget Password ?</a>
                </div>
            </form>
            <div class="fitness-auth-button-section">
                <a href="home.html" class="btn fitness-btn">Log in</a>
                <ul class="social-media-list">
                    <li>
                        <a href="https://www.google.com/">
                            <img src="../assets/images/social-media/google.svg" class="img-fluid" alt="google">
                            <span>Google</span>
                        </a>
                    </li>
                    <li>
                        <a href="https://www.apple.com/">
                            <img src="../assets/images/social-media/apple-white.svg" class="img-fluid" alt="apple">
                            <span>Apple</span>
                        </a>
                    </li>
                </ul>
                <h5>Don’t have an account? <a href="register.html"> Sign up for free</a></h5>
            </div>
        </div>
    </section>
    <!-- auth section  end  -->

    <!-- Bootstrap JS-->
    <script src="../assets/js/vendors/bootstrap/bootstrap.min.js"></script>

    <!-- Iconsax JS-->
    <script src="../assets/js/iconsax.js"></script>

    <!-- script JS -->
    <script src="../assets/js/script.js"></script>

</body>

</html>
