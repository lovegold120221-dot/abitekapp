<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="appkart">
    <meta name="keywords" content="appkart">
    <meta name="author" content="appkart">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="../assets/images/logo/favicon.png" type="image/x-icon">
    <title>Appkart</title>
    <link rel="apple-touch-icon" href="../assets/images/logo/favicon.png">
    <meta name="title-color" content="#00162E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="appkart">
    <meta name="msapplication-TileImage" content="../assets/images/logo/favicon.png">
    <meta name="msapplication-TileColor" content="#FFFFFF">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Google font css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="../../../../fonts.googleapis.com/css2%3Ffamily=Anton&amp;family=Lato:ital,wght@0,100%3B0,300%3B0,400%3B0,700%3B0,900%3B1,100%3B1,300%3B1,400%3B1,700%3B1,900&amp;display=swap.css"
        rel="stylesheet">

    <!-- Bootstrap css -->
    <link id="rtl-link" rel="stylesheet" type="text/css" href="../assets/css/vendors/bootstrap/bootstrap.min.css">

    <!-- Iconsax css -->
    <link rel="stylesheet" type="text/css" href="../assets/css/iconsax.css">

    <!-- Iconly css -->
    <link rel="stylesheet" type="text/css" href="../assets/css/iconly.css">

    <!-- Style css -->
    <link id="change-link" rel="stylesheet" type="text/css" href="../assets/css/style.css">
</head>

<body class="ecommerce lato-font">

    <!-- loader Start -->
    <div class="loader">
        <img src="../assets/images/gif/fashion.gif" class="img-fluid" alt="ecommerce">
    </div>
    <!-- loader End -->

    <!-- Onboarding Start -->
    <section class="ecommerce-onboarding-section">
        <h1 class="ecommerce-onboarding-title">Create Your Own Look</h1>
        <div class="onboarding-image">
            <img src="../assets/images/ecommerce/onboarding/line.png" class="img-fluid line-img" alt="">
            <div class="image-1">
                <img src="../assets/images/ecommerce/onboarding/1.png" class="img-fluid" alt="img">
            </div>
            <div class="image-2">
                <img src="../assets/images/ecommerce/onboarding/2.png" class="img-fluid" alt="img">
            </div>
            <div class="image-3">
                <img src="../assets/images/ecommerce/onboarding/3.png" class="img-fluid" alt="img">
            </div>
        </div>

        <div class="onboarding-content-box">
            <div class="custom-container">
                <h2>Welcome to Biggest Online Store</h2>
                <h5>Explore the latest fashion trends at fashion!
                    Discover new arrivals</h5>
                <a href="login.html" class="btn solid-btn ecommerce-onboarding-btn w-100">Start
                    Shopping</a>
                <h6>Already have an account? <a href="index.html#!">Sign In</a></h6>
            </div>
        </div>
    </section>
    <!-- Onboarding End -->

    <!-- pwa install app popup start -->
    <div class="offcanvas addtohome-popup show">
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
        <div class="offcanvas-body small">
            <div class="app-info">
                <img src="../assets/images/logo/appkart/48.png" class="img-fluid" alt="logo">
                <div class="content">
                    <h3>Appkart App</h3>
                    <a href="index.html#!">www.appkart-app.com</a>
                </div>
            </div>
            <button class="btn install-app btn-inline home-screen-btn m-0" id="installApp">Add to Home
                Screen</button>
        </div>
    </div>
    <!-- pwa install app popup end -->

    <!-- Bootstrap js-->
    <script src="../assets/js/vendors/bootstrap/bootstrap.min.js"></script>

    <!-- template Settings js-->
    <script src="../assets/js/template-setting.js"></script>

    <!-- Install JS -->
    <script src="../assets/js/homescreen-popup.js"></script>

    <!-- script js-->
    <script src="../assets/js/script.js"></script>
</body>

</html>
