<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="appkart">
    <meta name="keywords" content="appkart">
    <meta name="author" content="appkart">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="../assets/images/logo/favicon.png" type="image/x-icon">
    <title>Appkart</title>
    <link rel="apple-touch-icon" href="../assets/images/logo/favicon.png">
    <meta name="title-color" content="#00162E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="appkart">
    <meta name="msapplication-TileImage" content="../assets/images/logo/favicon.png">
    <meta name="msapplication-TileColor" content="#FFFFFF">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- Google font css -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="../../../../fonts.googleapis.com/css2%3Ffamily=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000%3B1,6..12,200..1000&amp;display=swap.css"
        rel="stylesheet">
    <!-- Bootstrap css -->
    <link id="rtl-link" rel="stylesheet" type="text/css" href="../assets/css/vendors/bootstrap/bootstrap.min.css">

    <!-- Iconsax css -->
    <link rel="stylesheet" type="text/css" href="../assets/css/iconsax.css">

    <!-- Iconly css -->
    <link rel="stylesheet" type="text/css" href="../assets/css/iconly.css">

    <!-- Style css -->
    <link id="change-link" rel="stylesheet" type="text/css" href="../assets/css/style.css">
</head>

<body class="plant nunito-font">

    <!-- loader Start -->
    <div class="loader">
        <img src="../assets/images/gif/plant.gif" class="img-fluid" alt="plant">
    </div>
    <!-- loader End -->

    <!-- header starts -->
    <header class="header ecommerce-main-header plant-header">
        <div class="custom-container2">
            <div class="header-panel">
                <div class="header-top-content">
                    <a href="delivery-address.html#" onclick="history.back()" class="plant-icon">
                        <i class="iconsax icon-btn" data-icon="chevron-left"> </i>
                    </a>
                    <h3>Delivery Address</h3>
                </div>
            </div>
        </div>
    </header>
    <!-- header end -->

    <!-- address section start -->
    <section class="pt-0 section-b-space">
        <div class="container">
            <ul class="plant-address-list">
                <li class="address-box">
                    <label class="addreass-label" for="basic">
                        <span class="address-content">
                            <img class="img-fluid" src="../assets/images/plant/map.png" alt="map">
                            <span class="address-details">
                                <span class="flex-space">
                                    <span class="address-title"><i class="iconsax icon"
                                            data-icon="home-2"></i>Home</span>
                                    <input class="form-check-input" type="radio" name="address" id="basic" checked>
                                </span>
                                <span class="d-block">
                                    <span class="address-location">
                                        4140 Parker Rd. Allentown, New
                                        Mexico.
                                    </span>
                                </span>
                                <span class="content-color">Zip Code: 74562-1198</span>
                            </span>
                        </span>
                    </label>
                </li>

                <li class="address-box">
                    <label class="addreass-label" for="basic2">
                        <span class="address-content">
                            <img class="img-fluid" src="../assets/images/plant/map.png" alt="map">
                            <span class="address-details">
                                <span class="flex-space">
                                    <span class="address-title"><i class="iconsax icon"
                                            data-icon="building-1"></i>Work</span>
                                    <input class="form-check-input" type="radio" name="address" id="basic2">
                                </span>
                                <span class="d-block">
                                    <span class="address-location">
                                        3891 Ranchview Dr. Richard, California.
                                    </span>
                                </span>
                                <span class="content-color">Zip Code: 74562-1198</span>
                            </span>
                        </span>
                    </label>
                </li>
                <li class="address-box">
                    <label class="addreass-label" for="basic3">
                        <span class="address-content">
                            <img class="img-fluid" src="../assets/images/plant/map.png" alt="map">
                            <span class="address-details">
                                <span class="flex-space">
                                    <span class="address-title"><i class="iconsax icon"
                                            data-icon="building-1"></i>Work</span>
                                    <input class="form-check-input" type="radio" name="address" id="basic3">
                                </span>
                                <span class="d-block">
                                    <span class="address-location">
                                        3891 Ranchview Dr. Richard, California.
                                    </span>
                                </span>
                                <span class="content-color">Zip Code: 74562-1198</span>
                            </span>
                        </span>
                    </label>
                </li>
            </ul>
        </div>
    </section>

    <!-- Bootstrap js-->
    <script src="../assets/js/vendors/bootstrap/bootstrap.min.js"></script>

    <!-- Iconsax js-->
    <script src="../assets/js/iconsax.js"></script>

    <!-- template Settings js-->
    <script src="../assets/js/template-setting.js"></script>

    <!-- script js-->
    <script src="../assets/js/script.js"></script>
</body>

</html>
