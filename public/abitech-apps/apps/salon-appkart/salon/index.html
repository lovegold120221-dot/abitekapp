<body class="salon lato-font">

    <!-- loader Start -->
    <div class="loader">
        <img src="../assets/images/gif/Salon.gif" class="img-fluid" alt="salon">
    </div>
    <!-- loader End -->

    <!-- onboarding section start -->
    <section class="boarding-salon-section">
        <div class="boarding-salon-img">
            <img src="../assets/images/salon/salon/1.jpg" class="img-fluid" alt="salon-img">
        </div>
        <div class="boarding-salon-content">
            <h1> Your Beauty Journey Begins Here</h1>
            <p>"Enjoy exclusive discounts and loyalty rewards for your regular pampering."</p>
            <a href="login.html" class="btn salon-btn">Get Started</a>
            <h5>Already have an account? <a href="sign.html">Sign In</a></h5>
        </div>
    </section>
    <!-- onboarding section end -->

    <!-- pwa install app popup start -->
    <div class="offcanvas addtohome-popup  show">
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
        <div class="offcanvas-body small">
            <div class="app-info">
                <img src="../assets/images/logo/appkart/48.png" class="img-fluid" alt="logo">
                <div class="content">
                    <h3>Appkart App</h3>
                    <a href="index.html#!">www.appkart-app.com</a>
                </div>
            </div>
            <button class="btn  install-app btn-inline home-screen-btn m-0" id="installApp">Add to Home
                Screen</button>
        </div>
    </div>
    <!-- pwa install app popup end -->

    <!-- Bootstrap js-->
    <script src="../assets/js/vendors/bootstrap/bootstrap.min.js"></script>

    <!-- Iconsax js-->
    <script src="../assets/js/iconsax.js"></script>

    <!-- Install JS -->

    <script src="../assets/js/script.js"></script>
