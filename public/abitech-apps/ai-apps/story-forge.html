<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story Forge — Abitech AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Georgia:ital@0;1&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; }
    .story { font-family: 'Georgia', serif; }
    .fade-in { animation: fadeIn .5s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="min-h-screen bg-[#1a1207] text-amber-100">
  <div class="max-w-2xl mx-auto px-4 py-8">
    <div class="text-center mt-4">
      <div class="text-5xl">📜</div>
      <h1 class="text-3xl font-bold mt-2 text-amber-50">Story Forge</h1>
      <p class="text-sm text-amber-300/80 mt-1">Name a hero, a world, a villain — get a three-chapter legend.</p>
    </div>

    <div class="mt-6 bg-black/40 rounded-2xl p-5 border border-amber-700/40">
      <div class="grid sm:grid-cols-3 gap-2">
        <input id="heroInput" placeholder="Hero: e.g. Zara the baker" class="bg-black/40 rounded-xl px-3 py-2.5 text-sm outline-none border border-amber-700/40 focus:border-amber-400 placeholder:text-amber-200/30" />
        <input id="worldInput" placeholder="World: floating islands" class="bg-black/40 rounded-xl px-3 py-2.5 text-sm outline-none border border-amber-700/40 focus:border-amber-400 placeholder:text-amber-200/30" />
        <input id="villainInput" placeholder="Villain: the Soup King" class="bg-black/40 rounded-xl px-3 py-2.5 text-sm outline-none border border-amber-700/40 focus:border-amber-400 placeholder:text-amber-200/30" />
      </div>
      <div class="flex gap-2 mt-3">
        <button id="forgeBtn" onclick="forge()" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-semibold text-sm py-2.5 rounded-full transition">Forge my legend ⚔️</button>
        <button id="twistBtn" onclick="twist()" disabled class="px-5 bg-white/10 disabled:opacity-40 font-semibold text-sm rounded-full transition border border-amber-700/40">🌀 Twist!</button>
      </div>
    </div>

    <div id="errorBox" class="hidden mt-4 text-sm bg-red-500/20 border border-red-400/40 rounded-xl p-3"></div>
    <div id="result" class="mt-5"></div>
  </div>

  <script>
const GEMINI_KEY = sessionStorage.getItem('abitech_gemini_key') || '';
    const GEMINI_MODEL = "gemini-3.5-flash-lite";
    const LIVE_MODEL = "gemini-3.5-flash-live";
    let lastStory = '';
    function esc(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' }[c])); }
    function fmt(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b class="text-amber-300">$1</b>').replace(/\n/g, '<br>'); }

    // Gemini Live API TTS voice state
    let ttsWs = null;
    let ttsQueue = [];
    let ttsSpeaking = false;
    function ttsSpeakQueue() {
      if (ttsSpeaking || !ttsWs) return;
      if (ttsQueue.length === 0) { ttsSpeaking = false; return; }
      const text = ttsQueue.shift();
      ttsSpeaking = true;
      ttsWs.send(JSON.stringify({
        turns: [{ parts: [{ text: text }] }], turnComplete: true
      }));
    }
    function ttsStop() { try { if (ttsWs) ttsWs.close(); ttsSpeaking = false; ttsQueue = []; } catch (e) {} }

    // Initialise Live API TTS WebSocket
    function ttsInit() {
      if (ttsWs) return;
      const wsUrl = `wss://generativelanguage.googleapis.com/v1beta/models/${LIVE_MODEL}:streamGenerateContent?key=${GEMINI_KEY}`;
      ttsWs = new WebSocket(wsUrl);
      ttsWs.onopen = () => ttsSpeakQueue();
      ttsWs.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.serverContent && data.serverContent.modelTurn && data.serverContent.modelTurn.parts) {
          const audioB64 = data.serverContent.modelTurn.parts.find(p => p.inlineData).inlineData.data;
          const audioBlob = base64ToBlob(audioB64, 'audio/mp3');
          const url = URL.createObjectURL(audioBlob);
          const audio = new Audio(url);
          audio.play().catch(() => {});
          ttsSpeaking = false;
          ttsSpeakQueue();
        }
      };
      ttsWs.onerror = () => { ttsSpeaking = false; ttsSpeakQueue(); };
    }

    // Send text to Gemini Live API for TTS
    function ttsPlay(text) {
      try { text = String(text).replace(/[*#_]/g, '').slice(0, 1500); } catch (e) {}
      if (!text) return;
      ttsQueue.push(text);
      ttsInit();
      ttsSpeakQueue();
    }

    // Base64 decode helper for audio chunks
    function base64ToBlob(b64, mime) {
      const byteChars = atob(b64);
      const byteNumbers = new Uint8Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
      return new Blob([byteNumbers], { type: mime });
    }

    function hearBtn(i, label) { return `<button onclick="ttsPlay(spokenTexts[${i}] || '')" class="mt-3 text-xs font-semibold text-amber-300 hover:text-amber-200">🔊 ${label || 'Listen'}</button>`; }

    async function gemini(system, user) {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_KEY}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ system_instruction: { parts: [{ text: system }] }, contents: [{ parts: [{ text: user }] }], generationConfig: { temperature: 1.0, maxOutputTokens: 900 } })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      return data.candidates[0].content.parts.map(p => p.text || '').join('');
    }

    async function forge() {
      const hero = document.getElementById('heroInput').value.trim() || 'a brave nobody';
      const world = document.getElementById('worldInput').value.trim() || 'a strange land';
      const villain = document.getElementById('villainInput').value.trim() || 'a dark lord';
      const btn = document.getElementById('forgeBtn'), err = document.getElementById('errorBox'), out = document.getElementById('result');
      err.classList.add('hidden');
      btn.disabled = true; btn.textContent = 'Hammering… 🔨'; out.innerHTML = '';
      stopSpeak();
      try {
        lastStory = await gemini(
          'You are a master storyteller. Write a THREE-chapter mini adventure (Chapter I, II, III headers), vivid but tight, ~300 words total, ending on a cliffhanger. No preamble.',
          `Hero: ${hero}. World: ${world}. Villain: ${villain}.`);
        out.innerHTML = `<div class="fade-in bg-black/40 rounded-2xl p-6 border border-amber-600/40"><div class="story text-[15px] leading-relaxed">${fmt(lastStory)}</div>${hearBtn(spokenTexts.push(lastStory) - 1, 'Hear the tale')}</div>`;
        document.getElementById('twistBtn').disabled = false;
      } catch (e) { err.textContent = 'Forge went cold: ' + e.message; err.classList.remove('hidden'); }
      btn.disabled = false; btn.textContent = 'Forge my legend ⚔️';
    }

    async function twist() {
      const btn = document.getElementById('twistBtn'), err = document.getElementById('errorBox'), out = document.getElementById('result');
      err.classList.add('hidden');
      btn.disabled = true; btn.textContent = 'Twisting…';
      stopSpeak();
      try {
        const t = await gemini('You are a master of plot twists. Given the story so far, write ONE shocking twist chapter (max 120 words) that reframes everything. No preamble.',
          'Story so far:\n' + lastStory);
        lastStory += '\n\n' + t;
        out.insertAdjacentHTML('beforeend', `<div class="fade-in mt-4 bg-purple-950/60 rounded-2xl p-6 border border-purple-500/40"><p class="text-xs uppercase tracking-widest text-purple-300 font-semibold mb-2">🌀 Plot twist</p><div class="story text-[15px] leading-relaxed">${fmt(t)}</div></div>`);
      } catch (e) { err.textContent = 'Twist failed: ' + e.message; err.classList.remove('hidden'); }
      btn.disabled = false; btn.textContent = '🌀 Twist!';
    }
  </script>
</body>
</html>
